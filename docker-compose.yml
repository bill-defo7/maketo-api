services:
  postgres:
    image: postgres:16
    container_name: maketo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maketo
      POSTGRES_USER: maketo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans le fichier .env}
    ports:
      - "5435:5432"
    volumes:
      - maketo-data:/var/lib/postgresql/data

volumes:
  maketo-data: